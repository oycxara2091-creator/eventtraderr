function drawGoldChart(data) {
  const line = document.getElementById('gold-line');
  if (!line) return;
  const prices = data || GOLD_DATA.map(d => d.price);
  const min = Math.min(...prices);
  const max = Math.max(...prices);
  const range = max - min || 1;
  const points = prices.map((price, i) => {
    const x = (i / (prices.length - 1)) * 300;
    const y = 100 - ((price - min) / range) * 80 - 10;
    return x + ',' + y;
  }).join(' ');
  line.setAttribute('points', points);
  const trend = prices[prices.length - 1] - prices[0];
  line.setAttribute('stroke', trend > 0 ? '#4ade80' : '#f87171');
}

function showYear(year) {
  if (year === 'all') {
    drawGoldChart(GOLD_DATA.map(d => d.price));
    document.querySelector('.chart-subtitle').textContent = 'Средняя цена за год, 2016–2026';
    return;
  }
  const monthly = GOLD_MONTHLY[year];
  if (monthly) {
    drawGoldChart(monthly);
    document.querySelector('.chart-subtitle').textContent = 'Цена по месяцам, ' + year;
  }
}

const container = document.getElementById('events-container');
const countBar = document.getElementById('count-bar');
const searchInput = document.getElementById('search');

const typeLabels = {
  sanctions: "Санкции",
  disaster: "Катастрофа",
  war: "Война",
  economy: "Экономика"
};

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function renderEvents(filter) {
  const query = (filter || "").toLowerCase().trim();
  const filtered = EVENTS.filter(ev => {
    if (!query) return true;
    const haystack = [ev.year, ev.country, ev.title, ev.desc, ev.type].join(" ").toLowerCase();
    return haystack.includes(query);
  });
  filtered.sort((a, b) => b.year - a.year);
  countBar.textContent = 'Найдено событий: ' + filtered.length + ' из ' + EVENTS.length;
  if (filtered.length === 0) {
    container.innerHTML = '<div class="no-results">Ничего не найдено.</div>';
    return;
  }
  let html = '';
  filtered.forEach(ev => {
    const sectorsHtml = (ev.sectors || []).map(s => {
      const cls = s.indexOf('↑') !== -1 ? 'up' : s.indexOf('↓') !== -1 ? 'down' : '';
      return '<span class="sector-tag ' + cls + '">' + escapeHtml(s) + '</span>';
    }).join('');
    html += '<div class="event-card">' +
      '<div class="event-header">' +
        '<span class="event-year">' + ev.year + '</span>' +
        '<span class="event-country">' + escapeHtml(ev.country) + '</span>' +
      '</div>' +
      '<div class="event-title">' +
        '<span class="event-type type-' + ev.type + '">' + (typeLabels[ev.type] || ev.type) + '</span>' +
        escapeHtml(ev.title) +
      '</div>' +
      '<div class="event-impact">' + escapeHtml(ev.desc) + '</div>' +
      '<div class="event-sectors">' + sectorsHtml + '</div>' +
    '</div>';
  });
  container.innerHTML = html;
}

let searchTimer = null;
searchInput.addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    renderEvents(e.target.value);
  }, 150);
});

// РЕНДЕР КАРТОЧЕК КОМПАНИЙ
function renderCompanies() {
  const liveGrid = document.getElementById('companies-grid');
  const defunctGrid = document.getElementById('defunct-grid');
  if (!liveGrid || !defunctGrid) return;
  
  let liveHtml = '';
  let defunctHtml = '';
  
  COMPANIES.forEach((c, i) => {
    const card = '<div class="company-card" data-index="' + i + '">' +
      '<div class="company-logo" style="background:' + c.color + '">' + c.letter + '</div>' +
      '<div class="company-name">' + c.name + '</div>' +
      '<div class="company-ticker">' + c.ticker + '</div>' +
      '<div class="company-sector">' + c.sector + '</div>' +
      '<div class="company-cap">' + c.cap + '</div>' +
    '</div>';
    
    if (c.defunct) {
      defunctHtml += card;
    } else {
      liveHtml += card;
    }
  });
  
  liveGrid.innerHTML = liveHtml;
  defunctGrid.innerHTML = defunctHtml;
}

document.querySelectorAll('.company-card').forEach(card => {
  card.addEventListener('click', () => {

    const content = document.getElementById('company-page-content');
    content.innerHTML = 
      '<div class="cp-logo" style="background:' + c.color + '">' + c.letter + '</div>' +

        '<div class="cp-row"><span class="cp-label">Год основания</span><span class="cp-value">' + c.founded + '</span></div>' +
        '<div class="cp-row"><span class="cp-label">Штаб-квартира</span><span class="cp-value">' + c.hq + '</span></div>' +
      '</div>' +
      '<div class="cp-section"><div class="cp-section-title">О компании</div><div class="cp-about">' + c.about + '</div></div>' +

});
