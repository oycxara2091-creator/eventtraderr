<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EventTrader — Реальные цены</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0e17;
    color: #e6edf3;
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #1a2332 0%, #0d1420 100%);
    padding: 20px;
    border-bottom: 1px solid #1f2a3a;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.5px; }
  .header h1 span { color: #4ade80; }
  .header p { font-size: 12px; color: #7d8da6; margin-top: 4px; }
  .container { padding: 16px; }
  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #5a6a80;
    margin-bottom: 12px;
    font-weight: 600;
  }
  .card {
    background: #111827;
    border: 1px solid #1f2a3a;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .event-type { font-size: 11px; color: #7d8da6; text-transform: uppercase; letter-spacing: 1px; }
  .severity { font-size: 10px; padding: 3px 8px; border-radius: 20px; font-weight: 600; }
  .sev-red { background: #7f1d1d; color: #fca5a5; }
  .sev-orange { background: #78350f; color: #fcd34d; }
  .sev-green { background: #14532d; color: #86efac; }
  .event-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .event-desc { font-size: 13px; color: #8b9bb4; line-height: 1.5; margin-bottom: 14px; }
  .signals { display: flex; flex-direction: column; gap: 8px; }
  .signal {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    background: #0d1420;
    border-radius: 8px;
    gap: 10px;
  }
  .signal-left { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .signal-asset { font-size: 13px; font-weight: 500; }
  .signal-ticker { font-size: 10px; color: #5a6a80; }
  .signal-reason { font-size: 10px; color: #7d8da6; margin-top: 2px; }
  .signal-price { font-size: 11px; color: #60a5fa; margin-top: 2px; font-weight: 500; }
  .signal-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .signal-prob { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; }
  .up { color: #4ade80; }
  .down { color: #f87171; }
  .neutral { color: #94a3b8; }
  .sparkline { display: block; }
  .footer { text-align: center; padding: 24px 16px; font-size: 11px; color: #4a5568; line-height: 1.6; }
  .loading { text-align: center; padding: 40px 16px; color: #7d8da6; font-size: 14px; }
  .status-bar {
    background: #1a2332;
    padding: 8px 16px;
    font-size: 11px;
    color: #7d8da6;
    text-align: center;
    border-bottom: 1px solid #1f2a3a;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Event<span>Trader</span></h1>
  <p>События + реальные цены (накопление истории)</p>
</div>

<div class="status-bar" id="status-bar">Загружаю...</div>

<div class="container" id="events-container">
  <div class="loading">Загружаю события...</div>
</div>

<div class="footer">
  Данные: GDACS + Finnhub.<br>
  Графики строятся по накопленной истории.<br>
  Не является инвестиционной рекомендацией.<br>
  EventTrader v0.8
</div>

<script>
// ==========================================
// СЛОЙ 1: ОБЩИЕ АКТИВЫ
// ==========================================

const EVENT_ASSET_MAP = {
  "EQ": { "gold": "Золото (XAU/USD)", "jpy": "JPY (Японская йена)", "auto": "Автопром (сектор)" },
  "TC": { "oil": "Нефть (Brent)", "gas": "Природный газ", "insurance": "Страхование (сектор)" },
  "FL": { "agri": "Сельхоз. товары", "logistics": "Логистика (сектор)", "semicon": "Полупроводники" },
  "VO": { "airlines": "Авиаперевозки (сектор)", "gold": "Золото" },
  "WF": { "timber": "Древесина", "agri": "Сельхоз. товары" },
  "DR": { "wheat": "Пшеница", "corn": "Кукуруза", "cattle": "Скот (говядина)" }
};

const DIRECTION_RULES = {
  "EQ": { "gold": { dir: "up", baseProb: 70 }, "jpy": { dir: "up", baseProb: 62 }, "auto": { dir: "down", baseProb: 58 } },
  "TC": { "oil": { dir: "up", baseProb: 65 }, "gas": { dir: "up", baseProb: 55 }, "insurance": { dir: "down", baseProb: 60 } },
  "FL": { "agri": { dir: "up", baseProb: 68 }, "logistics": { dir: "down", baseProb: 55 }, "semicon": { dir: "up", baseProb: 52 } },
  "VO": { "airlines": { dir: "down", baseProb: 72 }, "gold": { dir: "up", baseProb: 48 } },
  "WF": { "timber": { dir: "up", baseProb: 58 }, "agri": { dir: "up", baseProb: 45 } },
  "DR": { "wheat": { dir: "up", baseProb: 64 }, "corn": { dir: "up", baseProb: 60 }, "cattle": { dir: "up", baseProb: 50 } }
};

// Соответствие активов и тикеров для Finnhub
const ASSET_TICKERS = {
  "gold": "OANDA:XAU_USD",   // работает не всегда, попробуем
  "jpy": "OANDA:USD_JPY",
  "oil": "OANDA:BCO_USD",
  "gas": "OANDA:NATGAS_USD"
};

// ==========================================
// СЛОЙ 2: КОНКРЕТНЫЕ КОМПАНИИ
// ==========================================

const COMPANY_RULES = {
  "FL": [
    {
      country: "india",
      companies: [
        { name: "Supreme Petrochem", ticker: "SPLPETRO.NS", dir: "down", prob: 78, reason: "Завод в Ченнаи остановлен" },
        { name: "Saraswati Sugar Mill", ticker: "—", dir: "down", prob: 65, reason: "Уничтожено сахара на ₹6 млрд" },
        { name: "Punjab State Power Corp", ticker: "PSPCL.NS", dir: "down", prob: 60, reason: "Ущерб ₹10,3 млрд" }
      ]
    }
  ],
  "EQ": [
    {
      country: "japan",
      companies: [
        { name: "Mitsui Kinzoku", ticker: "5706.T", dir: "down", prob: 75, reason: "Завод в Хатинохе повреждён" },
        { name: "Kioxia", ticker: "285A.T", dir: "down", prob: 70, reason: "Завод в Иватэ остановлен" },
        { name: "Tokyo Electron", ticker: "8035.T", dir: "up", prob: 55, reason: "Конкуренты пострадали" }
      ]
    }
  ],
  "TC": [
    {
      country: "usa",
      companies: [
        { name: "Quanta Services", ticker: "PWR", dir: "up", prob: 72, reason: "Восстановление электросетей" },
        { name: "Energizer", ticker: "ENR", dir: "up", prob: 68, reason: "Спрос на батарейки" }
      ]
    }
  ]
};

function matchCompanies(eventType, description) {
  const rules = COMPANY_RULES[eventType];
  if (!rules) return [];
  const desc = (description || "").toLowerCase();
  const matched = [];
  rules.forEach(rule => {
    if (desc.includes(rule.country)) matched.push(...rule.companies);
  });
  const seen = new Set();
  return matched.filter(c => {
    if (seen.has(c.ticker)) return false;
    seen.add(c.ticker);
    return true;
  });
}

// ==========================================
// РАБОТА С ЦЕНАМИ (Finnhub + localStorage)
// ==========================================

const STORAGE_KEY = "eventtrader_prices";
const FINNHUB_FN = "/.netlify/functions/finnhub";

// Загружаем все сохранённые цены из localStorage
function loadPriceHistory() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

// Сохраняем историю цен
function savePriceHistory(history) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
  } catch (e) {
    console.warn("Не удалось сохранить историю:", e);
  }
}

// Получаем цену с Finnhub через Netlify Function
async function fetchPrice(ticker) {
  if (!ticker || ticker === "—") return null;
  try {
    const res = await fetch(`${FINNHUB_FN}?symbol=${encodeURIComponent(ticker)}`);
    const data = await res.json();
    if (data.c && data.c > 0) {
      return { price: data.c, change: data.d, changePercent: data.dp };
    }
    return null;
  } catch (e) {
    console.warn("Ошибка получения цены для", ticker, e);
    return null;
  }
}

// Записываем точку в историю: { ticker: [{t, p}, ...] }
function addPricePoint(history, ticker, price) {
  if (!history[ticker]) history[ticker] = [];
  const now = Date.now();
  const points = history[ticker];
  
  // Не записываем, если последняя точка была меньше 5 минут назад
  if (points.length > 0) {
    const last = points[points.length - 1];
    if (now - last.t < 5 * 60 * 1000) {
      last.p = price; // обновляем цену
      last.t = now;
      return;
    }
  }
  
  points.push({ t: now, p: price });
  
  // Держим максимум 200 точек
  if (points.length > 200) {
    points.splice(0, points.length - 200);
  }
}

// Получаем массив цен для графика
function getPricePoints(history, ticker) {
  if (!history[ticker] || history[ticker].length < 2) return null;
  return history[ticker].map(p => p.p);
}

// ==========================================
// ГРАФИКИ
// ==========================================

function drawSparkline(canvas, data, dir) {
  if (!data || data.length < 2) {
    // Если данных мало — рисуем плоскую линию
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.scale(dpr, dpr);
    
    ctx.beginPath();
    ctx.moveTo(0, h / 2);
    ctx.lineTo(w, h / 2);
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 1;
    ctx.stroke();
    return;
  }
  
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  ctx.scale(dpr, dpr);
  
  const min = Math.min(...data);
  const max = Math.max(...data);
  const range = max - min || 1;
  
  const stepX = w / (data.length - 1);
  
  // Определяем цвет по тренду
  const trend = data[data.length - 1] - data[0];
  const color = trend > 0 ? '#4ade80' : trend < 0 ? '#f87171' : '#94a3b8';
  
  // Линия
  ctx.beginPath();
  data.forEach((val, i) => {
    const x = i * stepX;
    const y = h - ((val - min) / range) * (h - 4) - 2;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.stroke();
  
  // Заливка
  ctx.lineTo(w, h);
  ctx.lineTo(0, h);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, color + '40');
  grad.addColorStop(1, color + '00');
  ctx.fillStyle = grad;
  ctx.fill();
}

function createSparkline(data, fallbackDir, width = 70, height = 28) {
  const canvas = document.createElement('canvas');
  canvas.className = 'sparkline';
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';
  
  requestAnimationFrame(() => {
    if (data && data.length >= 2) {
      drawSparkline(canvas, data, null);
    } else {
      drawSparkline(canvas, null, fallbackDir);
    }
  });
  return canvas;
}

// ==========================================
// РЕНДЕР
// ==========================================

const container = document.getElementById("events-container");
const statusBar = document.getElementById("status-bar");

const typeNames = {
  "EQ": "🌍 Землетрясение", "TC": "🌀 Циклон", "FL": "🌊 Наводнение",
  "VO": "🌋 Вулкан", "WF": "🔥 Пожар", "DR": "☀️ Засуха"
};

const alertNames = {
  "Red": { label: "Высокая", cls: "sev-red" },
  "Orange": { label: "Средняя", cls: "sev-orange" },
  "Green": { label: "Низкая", cls: "sev-green" }
};

function formatDate(d) {
  if (!d) return "—";
  return new Date(d).toLocaleString("ru-RU", {
    day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"
  });
}

function renderSignal(assetName, ticker, dir, prob, reason, priceData, historyData) {
  const arrow = dir === "up" ? "↑" : dir === "down" ? "↓" : "→";
  const cls = dir === "up" ? "up" : dir === "down" ? "down" : "neutral";
  const dirText = dir === "up" ? "Рост" : dir === "down" ? "Падение" : "Нейтр.";
  
  const signal = document.createElement('div');
  signal.className = 'signal';
  
  const left = document.createElement('div');
  left.className = 'signal-left';
  
  let priceHtml = "";
  if (priceData) {
    const changeSign = priceData.changePercent > 0 ? "+" : "";
    const changeClass = priceData.changePercent > 0 ? "up" : "down";
    priceHtml = `<span class="signal-price">$${priceData.price.toFixed(2)} <span class="${changeClass}">${changeSign}${priceData.changePercent.toFixed(2)}%</span></span>`;
  }
  
  left.innerHTML = `
    <span class="signal-asset">${assetName}${ticker && ticker !== "—" ? `<span class="signal-ticker"> ${ticker}</span>` : ""}</span>
    ${priceHtml}
    ${reason ? `<span class="signal-reason">${reason}</span>` : ""}
  `;
  
  const right = document.createElement('div');
  right.className = 'signal-right';
  
  const sparkline = createSparkline(historyData, dir);
  right.appendChild(sparkline);
  
  const probEl = document.createElement('span');
  probEl.className = `signal-prob ${cls}`;
  probEl.textContent = `${arrow} ${dirText} ${Math.round(prob)}%`;
  right.appendChild(probEl);
  
  signal.appendChild(left);
  signal.appendChild(right);
  return signal;
}

async function renderCard(event, priceHistory) {
  const type = event.eventtype || "UNKNOWN";
  const typeName = typeNames[type] || type;
  const title = event.name || event.description || "Событие";
  const alert = event.alertlevel || "Green";
  const alertInfo = alertNames[alert] || alertNames.Green;
  const country = event.country || "";
  const date = formatDate(event.todate || event.fromdate);
  
  let desc = event.description || event.htmldescription || "";
  desc = desc.replace(/<[^>]*>/g, "");
  if (desc.length > 250) desc = desc.substring(0, 250) + "...";
  
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-header">
      <div>
        <div class="event-type">${typeName}</div>
        <div class="event-title">${title}</div>
      </div>
      <span class="severity ${alertInfo.cls}">${alertInfo.label}</span>
    </div>
    <div class="event-desc">
      ${desc || "Описание недоступно."}
      <br><small style="color:#5a6a80">${country ? country + " • " : ""}${date}</small>
    </div>
    <div class="signals"></div>
  `;
  
  const signalsContainer = card.querySelector('.signals');
  
  // Общие активы
  const assets = EVENT_ASSET_MAP[type] || {};
  const rules = DIRECTION_RULES[type] || {};
  Object.keys(assets).forEach(assetKey => {
    const assetName = assets[assetKey];
    const rule = rules[assetKey] || { dir: "down", baseProb: 40 };
    const prob = rule.baseProb;
    signalsContainer.appendChild(
      renderSignal(assetName, null, rule.dir, prob, null, null, null)
    );
  });
  
  // Конкретные компании
  const companies = matchCompanies(type, desc + " " + country);
  if (companies.length > 0) {
    const titleEl = document.createElement('div');
    titleEl.className = 'section-title';
    titleEl.style.marginTop = '14px';
    titleEl.style.marginBottom = '8px';
    titleEl.textContent = 'Конкретные компании';
    signalsContainer.appendChild(titleEl);
    
    for (const c of companies) {
      const priceData = await fetchPrice(c.ticker);
      let historyData = null;
      
      if (priceData) {
        addPricePoint(priceHistory, c.ticker, priceData.price);
        historyData = getPricePoints(priceHistory, c.ticker);
      }
      
      signalsContainer.appendChild(
        renderSignal(c.name, c.ticker, c.dir, c.prob, c.reason, priceData, historyData)
      );
    }
  }
  
  return card;
}

// Демо-события на случай недоступности GDACS
const FALLBACK_EVENTS = [
  {
    eventtype: "FL", name: "Наводнение в Индии", alertlevel: "Red",
    description: "Масштабные наводнения в промышленных регионах.", country: "India"
  },
  {
    eventtype: "EQ", name: "Землетрясение M6.8 — Япония", alertlevel: "Red",
    description: "Сильное землетрясение у восточного побережья.", country: "Japan"
  },
  {
    eventtype: "TC", name: "Ураган «Мелисса» — США", alertlevel: "Orange",
    description: "Ураган приближается к побережью Флориды.", country: "USA"
  }
];

async function loadEvents() {
  let eventsToShow = [];
  let dataSource = 'GDACS';

  statusBar.textContent = "Загружаю события...";

  try {
    const today = new Date();
    const yesterday = new Date(today.getTime() - 24 * 60 * 60 * 1000);
    const from = yesterday.toISOString().split("T")[0];
    const to = today.toISOString().split("T")[0];
    const url = `https://www.gdacs.org/gdacsapi/api/events/geteventlist/SEARCH?eventlist=EQ;TC;FL;VO;WF;DR&fromdate=${from}&todate=${to}`;

    const response = await fetch(url);
    if (!response.ok) throw new Error(`GDACS: ${response.status}`);
    
    const data = await response.json();
    if (data.features && Array.isArray(data.features) && data.features.length > 0) {
      eventsToShow = data.features.map(ev => ev.properties || ev);
    } else {
      throw new Error("GDACS вернул пустой список");
    }
  } catch (e) {
    console.warn("GDACS недоступен, резервные данные:", e.message);
    dataSource = 'Резервные данные';
    eventsToShow = FALLBACK_EVENTS;
  }

  statusBar.textContent = `Источник: ${dataSource}. Загружаю цены...`;

  const priceHistory = loadPriceHistory();
  
  container.innerHTML = '';
  
  const titleEl = document.createElement('div');
  titleEl.className = 'section-title';
  titleEl.textContent = `События за 24 часа (${dataSource})`;
  container.appendChild(titleEl);
  
  for (const ev of eventsToShow.slice(0, 5)) {
    const card = await renderCard(ev, priceHistory);
    container.appendChild(card);
  }
  
  savePriceHistory(priceHistory);
  
  const totalTickers = Object.keys(priceHistory).length;
  const totalPoints = Object.values(priceHistory).reduce((sum, arr) => sum + arr.length, 0);
  statusBar.textContent = `Готово. В истории: ${totalTickers} тикеров, ${totalPoints} точек.`;
}

loadEvents();
</script>

</body>
</html>
