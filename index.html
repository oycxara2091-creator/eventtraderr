<title>EventTrader — История событий</title>
<style>

  .chart-subtitle { font-size: 11px; color: #7d8da6; margin-top: 2px; }
  .chart-price { font-size: 20px; font-weight: 700; color: #60a5fa; text-align: right; }
  .chart-change { font-size: 11px; margin-top: 2px; text-align: right; }
  .chart-change.up { color: #4ade80; }
  .chart-svg { width: 100%; height: 140px; display: block; }
  .chart-periods { display: flex; gap: 6px; margin-top: 12px; justify-content: center; }
  .chart-period { font-size: 11px; padding: 6px 12px; background: #0d1420; color: #7d8da6; border-radius: 6px; border: none; cursor: pointer; }

  .count-bar { font-size: 11px; color: #5a6a80; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .event-card { background: #111827; border: 1px solid #1f2a3a; border-radius: 12px; padding: 16px; margin-bottom: 10px; }
  .event-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 8px; }
  .event-year { font-size: 11px; background: #1e3a5f; color: #60a5fa; padding: 3px 8px; border-radius: 4px; font-weight: 600; flex-shrink: 0; }
  .event-country { font-size: 11px; color: #7d8da6; text-transform: uppercase; letter-spacing: 0.5px; }
  .event-title { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
  .event-type { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-right: 6px; }
  .type-sanctions { background: #7f1d1d; color: #fca5a5; }
  .type-disaster { background: #78350f; color: #fcd34d; }
  .type-war { background: #4c1d95; color: #c4b5fd; }
  .type-economy { background: #14532d; color: #86efac; }
  .event-impact { font-size: 12px; color: #8b9bb4; line-height: 1.5; margin-top: 8px; padding-top: 8px; border-top: 1px solid #1f2a3a; }
  .event-sectors { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .sector-tag { font-size: 9px; background: #0d1420; color: #7d8da6; padding: 2px 6px; border-radius: 4px; }
  .sector-tag.up { color: #4ade80; }
  .sector-tag.down { color: #f87171; }
  .no-results { text-align: center; padding: 40px 16px; color: #7d8da6; }
  .footer { text-align: center; padding: 24px 16px; font-size: 11px; color: #4a5568; line-height: 1.6; }
</style>
</head>

  <div id="events-container"></div>
</div>
<div class="footer">
