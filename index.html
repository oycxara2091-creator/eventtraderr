// ==========================================
// РЕНДЕР И ПОИСК
// ==========================================

const container = document.getElementById('events-container');
const countBar = document.getElementById('count-bar');
const searchInput = document.getElementById('search');

const typeLabels = {
  sanctions: "Санкции",
  disaster: "Катастрофа",
  war: "Война",
  economy: "Экономика"
};

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function renderEvents(filter) {
  const query = (filter || "").toLowerCase().trim();
  
  // Фильтруем события
  const filtered = EVENTS.filter(ev => {
    if (!query) return true;
    const haystack = [
      ev.year, ev.country, ev.title, ev.desc, ev.type,
      ...(ev.sectors || [])
    ].join(" ").toLowerCase();
    return haystack.includes(query);
  });
  
  // Сортируем: новые сверху
  filtered.sort((a, b) => b.year - a.year);
  
  countBar.textContent = `Найдено событий: ${filtered.length} из ${EVENTS.length}`;
  
  if (filtered.length === 0) {
    container.innerHTML = '<div class="no-results">Ничего не найдено. Попробуй другой запрос.</div>';
    return;
  }
  
  // Строим HTML
  let html = '';
  filtered.forEach(ev => {
    const sectorsHtml = (ev.sectors || []).map(s => {
      const cls = s.includes("↑") ? "up" : s.includes("↓") ? "down" : "";
      return `<span class="sector-tag ${cls}">${escapeHtml(s)}</span>`;
    }).join('');
    
    html += `
      <div class="event-card">
        <div class="event-header">
          <span class="event-year">${ev.year}</span>
          <span class="event-country">${escapeHtml(ev.country)}</span>
        </div>
        <div class="event-title">
          <span class="event-type type-${ev.type}">${typeLabels[ev.type] || ev.type}</span>
          ${escapeHtml(ev.title)}
        </div>
        <div class="event-impact">${escapeHtml(ev.desc)}</div>
        <div class="event-sectors">${sectorsHtml}</div>
      </div>
    `;
  });
  
  container.innerHTML = html;
}

// Поиск с задержкой (чтобы не тормозить при вводе)
let searchTimer = null;
searchInput.addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    renderEvents(e.target.value);
  }, 150);
});

const GOLD_DATA = [
  { year: 2016, price: 1249 },
  { year: 2017, price: 1258 },
  { year: 2018, price: 1269 },
  { year: 2019, price: 1393 },
  { year: 2020, price: 1770 },
  { year: 2021, price: 1800 },
  { year: 2022, price: 1801 },
  { year: 2023, price: 1943 },
  { year: 2024, price: 2388 },
  { year: 2025, price: 3442 },
  { year: 2026, price: 4886 }
];

function drawGoldChart() {
  const line = document.getElementById('gold-line');
  if (!line) return;
  
  const data = GOLD_DATA;
  const min = Math.min(...data.map(d => d.price));
  const max = Math.max(...data.map(d => d.price));
  const range = max - min || 1;
  
  const points = data.map((d, i) => {
    const x = (i / (data.length - 1)) * 300;
    const y = 100 - ((d.price - min) / range) * 80 - 10;
    return `${x},${y}`;
  }).join(' ');
  
  line.setAttribute('points', points);
  
  // Цвет по тренду
  const trend = data[data.length - 1].price - data[0].price;
  line.setAttribute('stroke', trend > 0 ? '#4ade80' : '#f87171');
}

drawGoldChart();
